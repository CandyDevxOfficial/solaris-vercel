<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLARIS RUNNER - Poskidsni Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #060913;
            --card-bg: rgba(15, 20, 32, 0.75);
            --primary: #ff5722;
            --primary-glow: rgba(255, 87, 34, 0.45);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --code-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 12px;
            overflow-x: hidden;
            position: relative;
        }

        .glow-orb-1 {
            position: fixed; top: -150px; left: -150px; width: 450px; height: 450px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(100px); z-index: -1; animation: orbit 14s ease-in-out infinite alternate;
        }
        .glow-orb-2 {
            position: fixed; bottom: -150px; right: -150px; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
            filter: blur(100px); z-index: -1; animation: orbit 18s ease-in-out infinite alternate-reverse;
        }
        @keyframes orbit { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(60px, 80px) scale(1.15); } 
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        #forbiddenView { 
            display: none; 
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.3s ease-out;
        }
        .card-403 {
            background: rgba(15, 20, 32, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 87, 34, 0.4);
            padding: 40px 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 87, 34, 0.25);
        }
        .code-403 { 
            font-size: 80px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #ff5722, #ff8a65);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'JetBrains Mono', monospace; 
            line-height: 1;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 25px var(--primary-glow));
        }
        .title-403 { font-size: 20px; margin-bottom: 8px; font-weight: 700; color: #fff; }
        .desc-403 { font-size: 13px; color: var(--text-sub); margin-bottom: 26px; line-height: 1.6; }
        .btn-403 { 
            background: linear-gradient(135deg, #ff5722, #e64a19); 
            color: #fff; 
            padding: 12px 26px; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: 0.2s ease;
        }
        .btn-403:hover { transform: translateY(-2px); }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-title { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; color: #ff5722; }
        .brand-sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .editor-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .label-title { font-size: 11px; font-weight: 700; color: #d1d5db; letter-spacing: 1px; text-transform: uppercase; }
        .btn-mini-group { display: flex; gap: 8px; }
        .btn-mini {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-light);
            color: #e5e7eb;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-mini:hover { background: rgba(255, 255, 255, 0.12); }

        .editor-wrapper {
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s;
        }
        .editor-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        textarea {
            width: 100%; height: 180px; background: transparent; border: none;
            color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 13px;
            outline: none; resize: vertical; line-height: 1.6;
        }

        .editor-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
        .char-counter { font-size: 12px; color: var(--text-sub); font-family: 'JetBrains Mono', monospace; }

        .btn-submit {
            background: linear-gradient(135deg, #ff5722, #e64a19);
            color: #ffffff; border: none; border-radius: 12px; padding: 12px 22px;
            font-size: 13.5px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow); transition: all 0.25s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 87, 34, 0.7); }

        .result-box {
            display: none; margin-top: 24px; padding-top: 20px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .code-display {
            background: rgba(3, 7, 18, 0.95); border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 12px; padding: 14px; color: var(--code-green);
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            word-break: break-all; margin-top: 8px; margin-bottom: 14px;
        }

        .action-btn-group { display: flex; gap: 10px; }
        .btn-copy-main {
            flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-light);
            color: var(--text-main); padding: 12px; border-radius: 12px; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-copy-main:hover { background: rgba(255, 255, 255, 0.16); }
        .btn-copy-script { background: rgba(255, 87, 34, 0.15); border: 1px solid rgba(255, 87, 34, 0.4); color: #ff8a65; }
        .btn-copy-script:hover { background: rgba(255, 87, 34, 0.3); }
    </style>
</head>
<body>

<div class="glow-orb-1"></div>
<div class="glow-orb-2"></div>

<div class="main-card" id="mainView">
    <div class="brand-header">
        <div class="brand-title">SOLARIS RUNNER</div>
        <div class="brand-sub">Secure Executable Script Engine</div>
    </div>

    <div class="form-group">
        <div class="editor-top">
            <span class="label-title">CODE (LUA / TEXT)</span>
            <div class="btn-mini-group">
                <button class="btn-mini" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-folder-open"></i> Upload File</button>
                <button class="btn-mini" onclick="document.getElementById('rawCode').value=''; updateCount();"><i class="fa-solid fa-broom"></i> Clear</button>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".lua,.txt" style="display:none;" onchange="handleFile(this)">

        <div class="editor-wrapper">
            <textarea id="rawCode" placeholder="-- Paste your Lua script here..." oninput="updateCount()"></textarea>
        </div>

        <div class="editor-bottom">
            <span class="char-counter" id="charCount">0 characters</span>
            <button class="btn-submit" id="convertBtn" onclick="createRaw()"><i class="fa-solid fa-bolt"></i> Convert Script</button>
        </div>
    </div>

    <div class="result-box" id="resultArea">
        <span class="label-title"><i class="fa-solid fa-terminal"></i> Loadstring (Roblox Executor)</span>
        <div class="code-display" id="loadstringBox"></div>
        <div class="action-btn-group">
            <button class="btn-copy-main" id="copyBtn" onclick="copyLoadstring()"><i class="fa-regular fa-copy"></i> Copy Loadstring</button>
            <button class="btn-copy-main btn-copy-script" id="copyScriptBtn" onclick="copyRawScript()"><i class="fa-solid fa-code"></i> Copy Script</button>
        </div>
    </div>
</div>

<div id="forbiddenView">
    <div class="card-403">
        <div class="code-403">403</div>
        <div class="title-403">Access Denied</div>
        <div class="desc-403">Direct Web Browser access is strictly blocked to protect script integrity. Executable requests only.</div>
        <button onclick="goHome()" class="btn-403"><i class="fa-solid fa-house"></i> Return to Home</button>
    </div>
</div>

<script>
window.onload = checkRoute;
window.onhashchange = checkRoute;

function checkRoute() {
    if (window.location.pathname.startsWith('/raw/')) {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('forbiddenView').style.display = 'block';
    } else {
        document.getElementById('forbiddenView').style.display = 'none';
        document.getElementById('mainView').style.display = 'block';
    }
}

function updateCount() {
    const len = document.getElementById('rawCode').value.length;
    document.getElementById('charCount').innerText = len + ' characters';
}

function handleFile(input) {
    const file = input.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('rawCode').value = e.target.result;
            updateCount();
        };
        reader.readAsText(file);
    }
}

async function createRaw() {
    const code = document.getElementById('rawCode').value.trim();
    if (!code) return alert('Please enter code.');

    const btn = document.getElementById('convertBtn');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Converting...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/raw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        });
        
        const data = await res.json();
        
        if (data.loadstring) {
            document.getElementById('loadstringBox').innerText = data.loadstring;
            document.getElementById('resultArea').style.display = 'block';
        } else {
            alert('Error: ' + (data.error || 'Failed to convert script'));
        }
    } catch (err) {
        alert('Connection Error');
    } finally {
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Convert Script';
        btn.disabled = false;
    }
}

function copyLoadstring() {
    const text = document.getElementById('loadstringBox').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Loadstring'; }, 2000);
    });
}

function copyRawScript() {
    const text = document.getElementById('rawCode').value;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyScriptBtn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-code"></i> Copy Script'; }, 2000);
    });
}

function goHome() { window.location.href = '/'; }
</script>
</body>
    </html>
