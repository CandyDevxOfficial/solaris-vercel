<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLARIS RUNNER - Poskidsni Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #05070f;
            --card-bg: rgba(13, 17, 28, 0.75);
            --primary: #ff5722;
            --primary-glow: rgba(255, 87, 34, 0.4);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --code-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        .glow-orb-1 {
            position: fixed; top: -150px; left: -150px; width: 500px; height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            filter: blur(120px); z-index: -1; animation: orbit 14s ease-in-out infinite alternate;
        }
        .glow-orb-2 {
            position: fixed; bottom: -150px; right: -150px; width: 550px; height: 550px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(120px); z-index: -1; animation: orbit 18s ease-in-out infinite alternate-reverse;
        }
        @keyframes orbit { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(50px, 70px) scale(1.15); } 
        }

        .container {
            width: 100%;
            max-width: 650px;
            z-index: 10;
        }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-title { font-size: 32px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(135deg, #ff5722, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-sub { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        .nav-tabs {
            display: flex; background: rgba(15, 20, 32, 0.8);
            padding: 6px; border-radius: 16px; border: 1px solid var(--border-light);
            margin-bottom: 20px; gap: 6px; backdrop-filter: blur(20px);
        }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: transparent;
            color: var(--text-sub); font-weight: 700; font-size: 13px;
            border-radius: 12px; cursor: pointer; transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.2), rgba(139, 92, 246, 0.2));
            color: #fff; border: 1px solid rgba(255, 87, 34, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 16px; }
        .label-title { font-size: 11px; font-weight: 700; color: #d1d5db; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        
        input[type="text"], select, textarea {
            width: 100%; background: rgba(3, 7, 18, 0.85);
            border: 1px solid var(--border-light); border-radius: 12px;
            padding: 12px 14px; color: #fff; font-size: 13px; outline: none;
            transition: all 0.25s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow);
        }
        textarea { height: 160px; font-family: 'JetBrains Mono', monospace; resize: vertical; line-height: 1.5; color: #00f2fe; }

        .switch-group {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(3, 7, 18, 0.6); padding: 12px 16px; border-radius: 14px;
            border: 1px solid var(--border-light); margin-bottom: 20px;
        }
        .switch-info { display: flex; flex-direction: column; }
        .switch-title { font-size: 13px; font-weight: 700; color: #fff; }
        .switch-desc { font-size: 11px; color: var(--text-sub); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background: linear-gradient(135deg, #ff5722, #8b5cf6); }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #ff5722, #e64a19);
            color: #ffffff; border: none; border-radius: 12px; padding: 14px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow); transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 87, 34, 0.6); }

        .search-box { margin-bottom: 20px; position: relative; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }
        .search-box input { padding-left: 40px; }

        .hub-list { display: flex; flex-direction: column; gap: 12px; }
        .hub-item {
            background: rgba(3, 7, 18, 0.7); border: 1px solid var(--border-light);
            border-radius: 16px; padding: 16px; transition: all 0.25s;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        .hub-item:hover { border-color: rgba(139, 92, 246, 0.5); transform: translateY(-2px); }
        .hub-info { display: flex; flex-direction: column; gap: 4px; }
        .hub-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .badge-hot { background: linear-gradient(135deg, #ff5722, #ef4444); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 800; }
        .badge-tag { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; width: fit-content; }
        .hub-stats { font-size: 11px; color: var(--text-sub); margin-top: 4px; display: flex; gap: 12px; }

        .btn-copy-hub {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(255, 87, 34, 0.4); color: #fff; padding: 10px 16px;
            border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer;
            transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 6px;
        }
        .btn-copy-hub:hover { background: linear-gradient(135deg, #ff5722, #8b5cf6); }

        .code-result {
            margin-top: 20px; background: rgba(3, 7, 18, 0.95); border: 1px solid var(--code-green);
            border-radius: 12px; padding: 14px; color: var(--code-green);
            font-family: 'JetBrains Mono', monospace; font-size: 12px; word-break: break-all;
            display: none;
        }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #10b981; color: #fff;
            padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 13px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transform: translateY(100px);
            opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 100;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="glow-orb-1"></div>
<div class="glow-orb-2"></div>

<div class="container">
    <div class="brand-header">
        <div class="brand-title">SOLARIS RUNNER</div>
        <div class="brand-sub">Poskidsni Hub Script Engine</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('create')"><i class="fa-solid fa-code"></i> Create Script</button>
        <button class="tab-btn" onclick="switchTab('hub')"><i class="fa-solid fa-fire"></i> Public Hub</button>
    </div>

    <div class="card">
        <!-- CREATE TAB -->
        <div id="tab-create" class="tab-content active">
            <div class="form-group">
                <label class="label-title">Script Title</label>
                <input type="text" id="scriptTitle" placeholder="e.g. Build A Boat Auto Farm">
            </div>

            <div class="form-group">
                <label class="label-title">Game Category</label>
                <select id="scriptGame">
                    <option value="General">General / Other Games</option>
                    <option value="Build A Boat">Build A Boat For Treasure</option>
                    <option value="Identity Fraud">Identity Fraud</option>
                    <option value="Murder Mystery 2">Murder Mystery 2</option>
                </select>
            </div>

            <div class="form-group">
                <label class="label-title">Lua Code</label>
                <textarea id="rawCode" placeholder="-- Paste your Lua script here..."></textarea>
            </div>

            <div class="switch-group">
                <div class="switch-info">
                    <span class="switch-title">Publish to Public Hub</span>
                    <span class="switch-desc">Show this script in Public Hub for everyone</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="isPublic" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn-submit" id="convertBtn" onclick="createRaw()"><i class="fa-solid fa-bolt"></i> Convert Script</button>

            <div class="code-result" id="resultArea">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span style="color:#fff; font-weight:700;">Generated Loadstring:</span>
                    <button onclick="copyGenerated()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:700;"><i class="fa-regular fa-copy"></i> Copy</button>
                </div>
                <div id="loadstringText"></div>
            </div>
        </div>

        <!-- PUBLIC HUB TAB -->
        <div id="tab-hub" class="tab-content">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search scripts or games..." oninput="renderHub()">
            </div>

            <div class="hub-list" id="hubList"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast">Copied to Clipboard!</div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(tab === 'create') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-create').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-hub').classList.add('active');
        loadPublicHub();
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

let publicScripts = [];

async function createRaw() {
    const title = document.getElementById('scriptTitle').value.trim() || 'Untitled Script';
    const game = document.getElementById('scriptGame').value;
    const code = document.getElementById('rawCode').value.trim();
    const isPublic = document.getElementById('isPublic').checked;

    if (!code) return alert('Please enter code.');

    const btn = document.getElementById('convertBtn');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/raw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, game, code, isPublic })
        });
        
        const data = await res.json();
        
        if (data.loadstring) {
            document.getElementById('loadstringText').innerText = data.loadstring;
            document.getElementById('resultArea').style.display = 'block';
            showToast('Script Created Successfully!');
        } else {
            alert('Error: ' + (data.error || 'Failed to convert script'));
        }
    } catch (err) {
        alert('Connection Error');
    } finally {
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Convert Script';
        btn.disabled = false;
    }
}

function copyGenerated() {
    const text = document.getElementById('loadstringText').innerText;
    navigator.clipboard.writeText(text);
    showToast('Loadstring Copied!');
}

async function loadPublicHub() {
    try {
        const res = await fetch('/api/hub');
        publicScripts = await res.json();
        renderHub();
    } catch (err) {
        console.error(err);
    }
}

function renderHub() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const list = document.getElementById('hubList');
    list.innerHTML = '';

    const filtered = publicScripts.filter(s => 
        s.title.toLowerCase().includes(search) || s.game.toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">No public scripts found.</div>';
        return;
    }

    filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'hub-item';
        div.innerHTML = `
            <div class="hub-info">
                <div class="hub-title">
                    ${item.title}
                    ${item.copies > 5 ? '<span class="badge-hot"><i class="fa-solid fa-fire"></i> HOT</span>' : ''}
                </div>
                <span class="badge-tag">${item.game}</span>
                <div class="hub-stats">
                    <span><i class="fa-solid fa-copy"></i> ${item.copies || 0} copies</span>
                </div>
            </div>
            <button class="btn-copy-hub" onclick="copyHubLoadstring('${item.id}', this)">
                <i class="fa-regular fa-copy"></i> Copy
            </button>
        `;
        list.appendChild(div);
    });
}

async function copyHubLoadstring(id, btn) {
    const host = window.location.host;
    const protocol = window.location.protocol;
    const loadstring = `loadstring(game:HttpGet("${protocol}//${host}/raw/${id}"))()`;
    
    navigator.clipboard.writeText(loadstring);
    showToast('Loadstring Copied!');

    fetch(`/api/copy?id=${id}`, { method: 'POST' });
}
</script>
</body>
                        </html>
